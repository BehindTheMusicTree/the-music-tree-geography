[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "the-music-tree-geography"
version = "0.1.0"
description = "Geographic evidence, historical scope and spatial relation resolution"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = []

[project.urls]
Repository = "https://github.com/BehindTheMusicTree/the-music-tree-geography"

[project.optional-dependencies]
processing = ["polars==1.42.1", "numpy==2.5.2", "shapely==2.2.0"]

[dependency-groups]
dev = ["ruff==0.15.20", "pytest==9.1.1", "pytest-cov==7.1.0"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
